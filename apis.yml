name: Flow
description: >-
  Flow is a developer-friendly Layer 1 proof-of-stake blockchain built for
  consumer applications, NFTs, games, AI agents, and DeFi at scale. The Flow
  REST API (Access API) enables developers to query accounts, blocks,
  collections, events, and transactions, execute Cadence scripts, and submit
  signed transactions to the network. Flow supports both native Cadence smart
  contracts and EVM-compatible Solidity deployments.
