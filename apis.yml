apis:
  - name: Flow Access REST API
    description: >-
      The Flow Access REST API provides HTTP endpoints for querying on-chain
      data including blocks, transactions, collections, execution results,
      accounts, and events. It also supports executing read-only Cadence scripts
      and submitting signed transactions to the Flow network.
    image: https://developers.flow.com/img/flow-docs-logo.png
